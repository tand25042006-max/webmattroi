<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát Năng Lượng Mặt Trời</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        /* CSS GIAO DIỆN TỔNG THỂ */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        
        /* 1. MÀN HÌNH ĐĂNG NHẬP */
        #login-screen { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        #login-screen h2 { margin-bottom: 24px; color: #38bdf8; font-size: 24px; }
        #login-screen h2 i { margin-right: 10px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,0.2); }
        #btn-login { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 8px; color: #0f172a; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        #btn-login:hover { background: #0ea5e9; }
        #login-error { color: #f87171; font-size: 14px; margin-top: 12px; display: none; }

        /* 2. GIAO DIỆN DASHBOARD CHÍNH */
        #main-dashboard { display: none; width: 100%; max-width: 1200px; background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        header h1 { font-size: 24px; color: #38bdf8; }
        header h1 i { color: #f59e0b; margin-right: 10px; }
        .header-buttons { display: flex; gap: 10px; }
        .btn-action { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        #btn-excel { background: #10b981; color: white; }
        #btn-excel:hover { background: #059669; }
        #btn-logout { background: #ef4444; color: white; }
        #btn-logout:hover { background: #dc2626; }

        /* LƯỚI KHỐI HIỂN THỊ SỐ LIỆU */
        .dashboard-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #0f172a; padding: 24px; border-radius: 12px; border: 1px solid #334155; text-align: center; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .card.volt::before { background: #38bdf8; }
        .card.current::before { background: #a855f7; }
        .card.power::before { background: #f59e0b; }
        .card.temp::before { background: #ef4444; }
        
        .card i { font-size: 32px; margin-bottom: 12px; display: inline-block; }
        .card.volt i { color: #38bdf8; }
        .card.current i { color: #a855f7; }
        .card.power i { color: #f59e0b; }
        .card.temp i { color: #ef4444; }
        
        .card h3 { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .card .value { font-size: 28px; font-weight: 700; color: #fff; }

        /* THÔNG TIN PHỤ VÀ GÓC TẤM PIN */
        .footer-status { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px; font-size: 14px; color: #94a3b8; }
        .footer-status span i { margin-right: 6px; }
        .angle-val { font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2><i class="fa-solid fa-solar-panel"></i>Hệ Thống Solar</h2>
        <div class="input-group">
            <label>Tài khoản hệ thống:</label>
            <input type="text" id="txt-username" placeholder="Nhập tài khoản...">
        </div>
        <div class="input-group">
            <label>Mật khẩu mật mã:</label>
            <input type="password" id="txt-password" placeholder="Nhập mật khẩu...">
        </div>
        <button id="btn-login" onclick="handleLogin()">VÀO HỆ THỐNG</button>
        <p id="login-error">Thông tin đăng nhập chưa đúng, vui lòng nhập lại!</p>
    </div>

    <div id="main-dashboard">
        <header>
            <h1><i class="fa-solid fa-bolt-lightning"></i>HỆ THỐNG GIÁM SÁT VÀ BÁO LỖI NĂNG LƯỢNG MAT TRỜI</h1>
            <div class="header-buttons">
                <button id="btn-excel" class="btn-action" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Xuất Excel</button>
                <button id="btn-logout" class="btn-action" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
            </div>
        </header>

        <div class="dashboard-layout">
            <div class="card volt">
                <i class="fa-solid fa-car-battery"></i>
                <h3>Điện Áp</h3>
                <div class="value" id="dien-ap">0.0 V</div>
            </div>
            <div class="card current">
                <i class="fa-solid fa-arrow-trend-up"></i>
                <h3>Dòng Điện</h3>
                <div class="value" id="dong-dien">0.00 A</div>
            </div>
            <div class="card power">
                <i class="fa-solid fa-plug"></i>
                <h3>Công Suất</h3>
                <div class="value" id="cong-suat">0.0 W</div>
            </div>
            <div class="card temp">
                <i class="fa-solid fa-temperature-half"></i>
                <h3>Nhiệt Độ Pin</h3>
                <div class="value" id="nhiet-do">-- °C</div>
            </div>
        </div>

        <div class="footer-status">
            <span><i class="fa-solid fa-sun" style="color: #ff9933;"></i>Trục X: <span id="lbl-x" class="angle-val" style="color: #00f2fe;">0°</span></span>
            <span><i class="fa-solid fa-sun" style="color: #ff9933;"></i>Trục Y: <span id="lbl-y" class="angle-val" style="color: #ff3366;">0°</span></span>
            <span><i class="fa-solid fa-temperature-high" style="color: #ef4444;"></i>Môi trường: <span id="lbl-z" class="angle-val" style="color: #ffcc00;">0°C</span></span>
            <span><i class="fa-solid fa-clock"></i> Cập nhật đồng bộ: <span id="lbl-time" style="color: #10b981;">Liên tục (3s)</span></span>
        </div>
    </div>

    <script>
        // Đường dẫn API Render lấy dữ liệu từ ESP32 gửi lên
        const API_URL = "https://esp32-backend-vqfp.onrender.com/api/data";
        let localDataLogs = []; // Biến lưu tạm dữ liệu để xuất Excel công khai

        // --- HÀM XỬ LÝ ĐĂNG NHẬP ---
        function handleLogin() {
            const userField = document.getElementById("txt-username");
            const passField = document.getElementById("txt-password");
            const loginError = document.getElementById("login-error");

            const taiKhoan = userField ? userField.value.trim() : "";
            const matKhau = passField ? passField.value.trim() : "";

            if (taiKhoan === "tanvippro" && matKhau === "123456") {
                alert("Đăng nhập thành công!");
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-dashboard").style.display = "block";
                
                loadSolarData(); // Lấy dữ liệu ngay lập tức
                setInterval(loadSolarData, 3000); // Kích hoạt vòng lặp tự động lấy dữ liệu sau mỗi 3 giây
            } else {
                if (loginError) {
                    loginError.style.display = "block";
                } else {
                    alert("Thông tin đăng nhập chưa đúng!");
                }
            }
        }

        // --- HÀM ĐĂNG XUẤT ---
        function handleLogout() {
            document.getElementById("main-dashboard").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("txt-username").value = "";
            document.getElementById("txt-password").value = "";
            if(document.getElementById("login-error")) document.getElementById("login-error").style.display = "none";
        }

        // --- HÀM FETCH LẤY SỐ LIỆU TỪ BACKEND RENDER ---
        function loadSolarData() {
            fetch(API_URL)
                .then(response => {
                    if (!response.ok) throw new Error("Lỗi kết nối tới máy chủ Render!");
                    return response.json();
                })
                .then(data => {
                    console.log("Dữ liệu Solar đồng bộ thành công:", data);
                    if (data && data.length > 0) {
                        localDataLogs = data; // Lưu lại mảng phục vụ xuất báo cáo excel
                        const latest = data[data.length - 1]; // Lấy bản ghi mới nhất ở cuối mảng

                        // Đổ dữ liệu điện áp, dòng điện, công suất, nhiệt độ vào UI
                        if(document.getElementById("dien-ap")) {
                            document.getElementById("dien-ap").innerText = latest.dien_ap !== undefined ? latest.dien_ap.toFixed(1) + " V" : "0.0 V";
                        }
                        if(document.getElementById("dong-dien")) {
                            document.getElementById("dong-dien").innerText = latest.dong_dien !== undefined ? latest.dong_dien.toFixed(2) + " A" : "0.00 A";
                        }
                        if(document.getElementById("cong-suat")) {
                            document.getElementById("cong-suat").innerText = latest.cong_suat !== undefined ? latest.cong_suat.toFixed(1) + " W" : "0.0 W";
                        }
                        if(document.getElementById("nhiet-do")) {
                            document.getElementById("nhiet-do").innerText = latest.nhiet_do !== undefined ? latest.nhiet_do + " °C" : "-- °C";
                        }
                        
                        // Đổ dữ liệu góc trục servo
                        if(document.getElementById("lbl-x") && latest.goc_x !== undefined) document.getElementById("lbl-x").innerText = latest.goc_x + "°";
                        if(document.getElementById("lbl-y") && latest.goc_y !== undefined) document.getElementById("lbl-y").innerText = latest.goc_y + "°";
                        if(document.getElementById("lbl-z") && latest.nhiet_do !== undefined) document.getElementById("lbl-z").innerText = latest.nhiet_do + "°C";
                    }
                })
                .catch(error => console.error("Lỗi đồng bộ dữ liệu Render:", error));
        }

        // --- HÀM XUẤT FILE EXCEL BÁO CÁO DỮ LIỆU ---
        function exportToExcel() {
            if (localDataLogs.length === 0) {
                alert("Không có dữ liệu logs để xuất file báo cáo!");
                return;
            }
            try {
                // Định dạng tiêu đề và trường dữ liệu trong file Excel xuất ra
                const formattedData = localDataLogs.map((item, index) => ({
                    "STT": index + 1,
                    "Điện Áp (V)": item.dien_ap,
                    "Dòng Điện (A)": item.dong_dien,
                    "Công Suất (W)": item.cong_suat,
                    "Nhiệt Độ (°C)": item.nhiet_do,
                    "Góc Trục X": item.goc_x,
                    "Góc Trục Y": item.goc_y,
                    "Thời Gian Ghi Nhận": item.created_at
                }));

                const worksheet = XLSX.utils.json_to_sheet(formattedData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Solar_Logs_Data");
                XLSX.writeFile(workbook, "BaoCao_HieuSuat_NangLuong_Solar.xlsx");
                alert("Xuất file báo cáo Excel thành công!");
            } catch (e) {
                console.error("Lỗi trong quá trình kết xuất dữ liệu Excel:", e);
                alert("Đã xảy ra lỗi khi tạo file excel!");
            }
        }

        // Ẩn dòng thông báo lỗi đỏ lúc vừa mở trang web lên
        document.addEventListener("DOMContentLoaded", () => {
            const loginError = document.getElementById("login-error");
            if (loginError) loginError.style.display = "none";
        });
    </script>
</body>
</html>
